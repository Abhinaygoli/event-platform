<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speakers — EventPlatform</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
    <div class="bg-mesh"></div>
    <div class="bg-noise"></div>

    <div class="page-content">
        <nav class="nav">
            <a href="/" class="nav-logo"><div class="nav-logo-dot"></div>EventPlatform</a>
            <div class="nav-links">
                <a href="events.html" class="nav-link">Events</a>
                <a href="speakers.html" class="nav-link" style="color:var(--accent)">Speakers</a>
                <span id="nav-auth-area"></span>
            </div>
        </nav>

        <div style="max-width:1200px;margin:0 auto;padding:40px 32px;">
            <div class="page-header">
                <div>
                    <div class="page-title">Speakers</div>
                    <div class="page-sub">Meet the experts presenting at our events</div>
                </div>
            </div>

            <div id="speakers-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;">
                <div class="loading-spinner"></div>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>
    <script src="js/auth.js"></script>
    <script>
  document.addEventListener('DOMContentLoaded', async () => {
    // Nav
    const area = document.getElementById('nav-auth-area');
    if (Auth.isLoggedIn()) {
      const link = Auth.getRole() === 'Admin' ? 'dashboard-admin.html'
                 : Auth.getRole() === 'Speaker' ? 'dashboard-speaker.html'
                 : 'dashboard-attendee.html';
      area.innerHTML = `<a href="${link}" class="nav-link">Dashboard</a>
        <button class="nav-cta" onclick="Auth.logout()">Logout</button>`;
    } else {
      area.innerHTML = `<a href="login.html" class="nav-cta">Sign In</a>`;
    }

    // Load speakers
    const grid = document.getElementById('speakers-grid');
    try {
      const speakers = await apiFetch('/api/speakers');
      if (!speakers.length) {
        grid.innerHTML = `<div class="empty-state"><div class="empty-icon">🎤</div><h3>No speakers yet</h3></div>`;
        return;
      }
      grid.innerHTML = speakers.map(sp => `
        <div class="card card-glow" style="padding:24px;display:flex;flex-direction:column;gap:16px">
          <div style="display:flex;gap:16px;align-items:center">
            ${sp.photoUrl
              ? `<img src="${sp.photoUrl}" style="width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--border)"/>`
              : `<div class="avatar" style="width:64px;height:64px;font-size:22px;flex-shrink:0">${sp.name.charAt(0)}</div>`}
            <div>
              <div style="font-family:var(--font-display);font-size:17px;font-weight:700">${sp.name}</div>
              ${sp.designation ? `<div style="font-size:13px;color:var(--accent)">${sp.designation}</div>` : ''}
              ${sp.company ? `<div style="font-size:12px;color:var(--text-secondary)">${sp.company}</div>` : ''}
            </div>
          </div>
          ${sp.bio ? `<p style="font-size:13px;color:var(--text-secondary);line-height:1.6">${sp.bio.length > 120 ? sp.bio.slice(0,120)+'…' : sp.bio}</p>` : ''}
          <div style="display:flex;align-items:center;justify-content:space-between;margin-top:auto">
            <span class="badge badge-accent">🎙 ${sp.sessionCount} sessions</span>
            ${sp.linkedInUrl ? `<a href="${sp.linkedInUrl}" target="_blank" class="btn btn-ghost btn-sm">LinkedIn →</a>` : ''}
          </div>
        </div>`).join('');
    } catch (err) {
      grid.innerHTML = `<div class="error-state">${err.message}</div>`;
    }
  });
    </script>
</body>
</html>
