<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard — EventPlatform</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
    <div class="bg-mesh"></div>
    <div class="bg-noise"></div>

    <div class="page-content dashboard">

        <!-- Sidebar -->
        <aside class="sidebar">
            <a href="/" class="sidebar-logo"><div class="nav-logo-dot"></div>EventPlatform</a>

            <div class="sidebar-section">Management</div>
            <a class="sidebar-link active" onclick="showSection('events')">
                <span class="sidebar-icon">📅</span> Events
            </a>
            <!--<a class="sidebar-link" onclick="showSection('sessions')">
                <span class="sidebar-icon">🎙</span> Sessions
            </a>-->
            <a class="sidebar-link" onclick="showSection('speakers')">
                <span class="sidebar-icon">🎤</span> Speakers
            </a>

            <div class="sidebar-section">Quick Links</div>
            <a href="events.html" class="sidebar-link">
                <span class="sidebar-icon">🌐</span> Public Events
            </a>
            <a href="/swagger" class="sidebar-link" target="_blank">
                <span class="sidebar-icon">📖</span> API Docs
            </a>

            <div class="sidebar-bottom">
                <div class="sidebar-user">
                    <div class="avatar" id="admin-avatar">A</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name" id="admin-name">Admin</div>
                        <div class="sidebar-user-role">Administrator</div>
                    </div>
                </div>
                <a class="sidebar-link" onclick="Auth.logout()">
                    <span class="sidebar-icon">🚪</span> Logout
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Stats row -->
            <div class="stats-grid" id="admin-stats">
                <div class="stat-card">
                    <div class="stat-card-icon">📅</div>
                    <div class="stat-card-label">Total Events</div>
                    <div class="stat-card-value accent" id="stat-events">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-icon">🎙</div>
                    <div class="stat-card-label">Total Sessions</div>
                    <div class="stat-card-value purple" id="stat-sessions">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-icon">🎤</div>
                    <div class="stat-card-label">Speakers</div>
                    <div class="stat-card-value pink" id="stat-speakers">—</div>
                </div>
            </div>

            <!-- Events Section -->
            <section id="section-events">
                <div class="page-header">
                    <div>
                        <div class="page-title">Events</div>
                        <div class="page-sub">Create and manage conference events</div>
                    </div>
                    <button class="btn btn-primary" onclick="openModal('event-modal')">+ New Event</button>
                </div>
                <!--tabs-->
                <div class="admin-event-tabs">
                    <button class="admin-event-tab active" data-tab="live">
                        Live
                    </button>

                    <button class="admin-event-tab" data-tab="upcoming">
                        Upcoming
                    </button>

                    <button class="admin-event-tab" data-tab="past">
                        Past
                    </button>
                </div>
                <div id="admin-events-grid" class="events-grid"></div>
                <div id="admin-events-pagination"></div>
            </section>

            <!-- Sessions Section (hidden by default) -->
            <!--<section id="section-sessions" class="hidden">
                <div class="page-header">
                    <div>
                        <div class="page-title">All Sessions</div>
                        <div class="page-sub">Manage sessions across all events</div>
                    </div>
                </div>
                <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--border-radius-lg,12px);padding:20px;margin-bottom:16px;">
                    <div style="font-size:13px;color:var(--text-secondary);">Select an event to manage its sessions:</div>
                    <select id="event-select-sessions" class="form-input" style="margin-top:8px;max-width:400px" onchange="loadSessionsForEvent(this.value)">
                        <option value="">— Choose event —</option>
                    </select>
                </div>
                <div id="admin-sessions-list" class="sessions-list"></div>
            </section>-->

            <!-- Speakers Section (hidden by default) -->
            <section id="section-speakers" class="hidden">
                <div class="page-header">
                    <div>
                        <div class="page-title">Speakers</div>
                        <div class="page-sub">All registered speaker profiles</div>
                    </div>
                </div>
                <div id="admin-speakers-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;"></div>
            </section>

        </main>
    </div>

    <!-- Create Event Modal -->
    <div class="modal-overlay" id="event-modal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Create New Event</div>
                <button class="modal-close" onclick="closeModal('event-modal')">×</button>
            </div>
            <form class="modal-form" onsubmit="handleCreateEvent(event)" id="create-event-form">
                <div class="form-group">
                    <label class="form-label">Event Title *</label>
                    <input id="ev-title" class="form-input" placeholder="e.g. .NET Conf 2025" required />
                </div>
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea id="ev-description" class="form-input" rows="3" placeholder="What is this event about?"></textarea>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                    <div class="form-group">
                        <label class="form-label">Start Date *</label>
                        <input id="ev-start" type="datetime-local" class="form-input" required />
                    </div>
                    <div class="form-group">
                        <label class="form-label">End Date *</label>
                        <input id="ev-end" type="datetime-local" class="form-input" required />
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Location</label>
                    <input id="ev-location" class="form-input" placeholder="e.g. Bengaluru, India" />
                </div>
                <div class="form-group">
                    <label class="form-label">Banner Image URL</label>
                    <input id="ev-banner" class="form-input" placeholder="https://..." />
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-ghost" onclick="closeModal('event-modal')">Cancel</button>
                    <button type="submit" id="create-event-btn" class="btn btn-primary">Create Event</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Event Modal -->
    <div class="modal-overlay" id="edit-event-modal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Edit Event</div>
                <button class="modal-close" onclick="closeModal('edit-event-modal')">×</button>
            </div>
            <form class="modal-form" onsubmit="handleEditEvent(event)">

                <!-- Hidden field to hold event ID -->
                <input type="hidden" id="edit-ev-id" />

                <div class="form-group">
                    <label class="form-label">Event Title *</label>
                    <input id="edit-ev-title" class="form-input"
                           placeholder="e.g. .NET Conf 2025" required />
                </div>

                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea id="edit-ev-description" class="form-input" rows="3"
                              placeholder="What is this event about?"></textarea>
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                    <div class="form-group">
                        <label class="form-label">Start Date *</label>
                        <input id="edit-ev-start" type="datetime-local" class="form-input" required />
                    </div>
                    <div class="form-group">
                        <label class="form-label">End Date *</label>
                        <input id="edit-ev-end" type="datetime-local" class="form-input" required />
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Location</label>
                    <input id="edit-ev-location" class="form-input"
                           placeholder="e.g. Bengaluru, India" />
                </div>

                <div class="form-group">
                    <label class="form-label">Banner Image URL</label>
                    <input id="edit-ev-banner" class="form-input" placeholder="https://..." />
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-ghost"
                            onclick="closeModal('edit-event-modal')">
                        Cancel
                    </button>
                    <button type="submit" id="edit-event-btn" class="btn btn-primary">
                        Save Changes
                    </button>
                </div>

            </form>
        </div>
    </div>

    <!-- Edit Session Modal (Admin only) -->
    <div class="modal-overlay" id="edit-session-modal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Edit Session</div>
                <button class="modal-close" onclick="closeModal('edit-session-modal')">×</button>
            </div>
            <form class="modal-form" onsubmit="handleEditSession(event)">

                <!-- Hidden field to hold session ID -->
                <input type="hidden" id="edit-session-id" />

                <div class="form-group">
                    <label class="form-label">Session Title *</label>
                    <input id="edit-s-title" class="form-input"
                           placeholder="e.g. Building APIs with .NET 8" required />
                </div>

                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea id="edit-s-description" class="form-input" rows="2"
                              placeholder="What will attendees learn?"></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">Speaker</label>
                    <select id="edit-s-speaker" class="form-input">
                        <option value="">No speaker assigned</option>
                        <!-- populated by loadSpeakersDropdown('edit-s-speaker') -->
                    </select>
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                    <div class="form-group">
                        <label class="form-label">Start Time *</label>
                        <input id="edit-s-start" type="datetime-local" class="form-input" required />
                    </div>
                    <div class="form-group">
                        <label class="form-label">End Time *</label>
                        <input id="edit-s-end" type="datetime-local" class="form-input" required />
                    </div>
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                    <div class="form-group">
                        <label class="form-label">Room</label>
                        <input id="edit-s-room" class="form-input" placeholder="e.g. Hall A" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Capacity</label>
                        <input id="edit-s-capacity" type="number" class="form-input"
                               value="100" min="1" />
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        Tags
                        <span class="text-muted" style="font-weight:400">(comma-separated)</span>
                    </label>
                    <input id="edit-s-tags" class="form-input" placeholder="dotnet, azure, api" />
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-ghost"
                            onclick="closeModal('edit-session-modal')">
                        Cancel
                    </button>
                    <button type="submit" id="edit-session-btn" class="btn btn-primary">
                        Save Changes
                    </button>
                </div>

            </form>
        </div>
    </div>

    <div id="toast-container"></div>
    <script src="js/auth.js"></script>
    <script src="js/events.js"></script>
    <script src="js/sessions.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            //Auth.requireAuth();
            const ok = await requireAuthWithRefresh();
            if (!ok) return;
            if (Auth.getRole() !== 'Admin') { Auth.redirectByRole(); return; }

            document.getElementById('admin-name').textContent = Auth.getName();
            document.getElementById('admin-avatar').textContent = Auth.getName()?.charAt(0)?.toUpperCase() || 'A';

            loadAdminDashboard(1, "live");
            loadAdminSpeakers();
            //loadEventNamesinSessionTab();
        });

        async function loadAdminDashboard(page, status) {
            const grid = document.getElementById('admin-events-grid');
            grid.innerHTML = `<div class="loading-spinner"></div>`;
            // Load events into grid
            const data = await apiFetch(`/api/events?page=${page}&pageSize=50&status=${status}`).catch(() => ({ items: [], totalCount: 0 }));
            document.getElementById('stat-events').textContent = data.totalCount || 0;
            document.getElementById('stat-sessions').textContent = data.sessionsCount || 0;

            // render events with admin actions
            if (!data.items.length) {
                grid.innerHTML = `<div class="empty-state"><div class="empty-icon">📅</div><h3>No events yet</h3><p>Create your first event above.</p></div>`;
            } else {
                grid.innerHTML = data.items.map(ev => `
                    <div class="event-card card card-glow">
                      ${ev.bannerUrl
                        ? `<img src="${ev.bannerUrl}" alt="${ev.title}" class="event-banner"
                         onclick="window.location.href='event-detail.html?id=${ev.id}'" style="cursor:pointer"/>`
                        : `<div class="event-banner-placeholder"
                         onclick="window.location.href='event-detail.html?id=${ev.id}'"
                         style="cursor:pointer"></div>`}
                      <div class="event-card-body">
                        <div class="event-meta"><span class="badge badge-accent">${formatDate(ev.startDate)}</span></div>
                         <h3 class="event-title" onclick="window.location.href='event-detail.html?id=${ev.id}'" style="cursor:pointer">${ev.title}</h3>
                        <div class="event-stats">
                          <span>📋 ${ev.sessionCount} sessions</span>
                          <span>👥 ${ev.registrationCount} registered</span>
                        </div>
                        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
                          <a href="event-detail.html?id=${ev.id}" class="btn btn-ghost btn-sm">Manage Sessions</a>
                          <button class="btn btn-ghost btn-sm" style="color:var(--error)" onclick="deleteEvent('${ev.id}')">Delete</button>
                        </div>
                      </div>
                    </div>`).join('');
            }
        }

        // tab click
        document.querySelectorAll(".admin-event-tab").forEach(tab => {
            tab.addEventListener("click", function () {
                document.querySelectorAll(".admin-event-tab")
                    .forEach(t => t.classList.remove("active"));
                this.classList.add("active");
                loadAdminDashboard(1,this.dataset.tab)
            });
        });

        async function loadAdminSpeakers() {
            // Load speakers count
            const speakers = await apiFetch('/api/speakers').catch(() => []);
            document.getElementById('stat-speakers').textContent = speakers.length;
            const grid = document.getElementById('admin-speakers-grid');
            const select = document.getElementById('edit-s-speaker');
            if (!speakers.length) {
                grid.innerHTML = `<div class="empty-state"><div class="empty-icon">🎤</div><h3>No speakers yet</h3></div>`;
                return;
            }
            grid.innerHTML = speakers.map(sp => `
                  <div class="card" style="padding:20px;display:flex;gap:14px;align-items:flex-start">
                    ${sp.photoUrl
                    ? `<img src="${sp.photoUrl}" style="width:48px;height:48px;border-radius:50%;object-fit:cover;flex-shrink:0"/>`
                    : `<div class="avatar" style="width:48px;height:48px;font-size:18px">${sp.name.charAt(0)}</div>`}
                    <div>
                      <div style="font-weight:600;font-size:15px">${sp.name}</div>
                      ${sp.designation ? `<div style="font-size:12px;color:var(--text-muted)">${sp.designation}</div>` : ''}
                      ${sp.company ? `<div style="font-size:12px;color:var(--text-secondary)">${sp.company}</div>` : ''}
                      <div style="font-size:11px;color:var(--text-muted);margin-top:4px">🎙 ${sp.sessionCount} sessions</div>
                    </div>
                  </div>`).join('');
            select.innerHTML = `<option value="">No speaker</option>` +
                speakers.map(sp => `<option value="${sp.id}">${sp.name}${sp.company ? ` (${sp.company})` : ''}</option>`).join('');
        }

        // async function loadEventNamesinSessionTab() {
        //     const eventSummaries = await apiFetch('/api/events/getallsummaries').catch(() => ({ items: [] }));
        //     // Populate event selector for sessions tab
        //     const sel = document.getElementById('event-select-sessions');
        //     if (eventSummaries.length) {
        //         eventSummaries.forEach(ev => {
        //             const opt = document.createElement('option');
        //             opt.value = ev.id; opt.textContent = ev.title;
        //             sel.appendChild(opt);
        //         });
        //     }
        // }
        function showSection(name) {
            ['events', 'speakers'].forEach(s => {
                document.getElementById(`section-${s}`).classList.toggle('hidden', s !== name);
            });
            document.querySelectorAll('.sidebar-link').forEach((el, i) => {
                el.classList.toggle('active', i === ['events', 'speakers'].indexOf(name));
            });
        }

        // Override loadEvents to use admin grid
        const _origLoadEvents = loadEvents;
        window.loadEvents = function (page, status) {
            // reload admin dashboard instead
            loadAdminDashboard(page, status);
        };
    </script>
</body>
</html>
